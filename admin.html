<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APLUS Student Database</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/aplus-database.js"></script>
<style>:root{--navy:#0b1736;--blue:#2563eb;--line:#e5e7eb;--muted:#687386}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fc;color:#16213e}header{background:var(--navy);color:#fff;padding:24px 5%}main{max-width:1250px;margin:auto;padding:28px 5%}.bar,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar input,.bar select,.bar button{padding:11px;border:1px solid #dbe1eb;border-radius:9px}.bar input{min-width:260px}.bar button{background:var(--blue);color:#fff;font-weight:800;border:0;cursor:pointer}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f8fafc;font-size:11px;text-transform:uppercase}tr:hover{background:#f8fbff}.pill{padding:5px 8px;border-radius:999px;background:#eaf2ff;color:var(--blue);font-weight:800}.login{max-width:430px;margin:80px auto}.login input{display:block;width:100%;padding:13px;margin:9px 0;border:1px solid #dbe1eb;border-radius:9px}.error{color:#b42318;margin-top:8px}.muted{color:var(--muted);font-size:13px}.detail{display:none}.back{padding:9px 12px;border:1px solid #dbe1eb;background:#fff;border-radius:9px;font-weight:800;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:15px;border:1px solid var(--line);border-radius:12px}.card b{font-size:22px}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}}</style></head><body>
<header><b>APLUS <span style="color:#7fb0ff">STUDENT DATABASE</span></b><div style="margin-top:8px;color:#cbd7ef">Secure admin view · Student 360° records</div></header>
<main><section id="login" class="panel login"><h2>Admin sign in</h2><p class="muted">Use a Supabase Authentication admin account. Student records are not exposed to anonymous visitors.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn" style="width:100%;padding:13px;background:#2563eb;color:#fff;border:0;border-radius:9px;font-weight:800">Sign in</button><div id="loginError" class="error"></div></section>
<section id="app" style="display:none"><div class="cards"><div class="card"><div class="muted">Students</div><b id="count">0</b></div><div class="card"><div class="muted">New</div><b id="newCount">0</b></div><div class="card"><div class="muted">Reviewing</div><b id="reviewCount">0</b></div><div class="card"><div class="muted">In Progress</div><b id="progressCount">0</b></div></div>
<div class="bar"><input id="search" placeholder="Search student, ID, university..."><select id="status"><option value="">All statuses</option><option>New</option><option>Reviewing</option><option>In Progress</option><option>Completed</option></select><button onclick="loadStudents()">Refresh</button><button onclick="logout()">Sign out</button></div>
<div class="tablewrap"><table><thead><tr><th>Student</th><th>Level</th><th>Target</th><th>Entry</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody id="body"></tbody></table></div></section>
<section id="detail" class="detail panel"><button class="back" onclick="showList()">← Back to database</button><div id="detailBody" style="margin-top:18px"></div></section></main>
<script>
let rows=[];
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
async function login(){const r=await APLUS_DATABASE.signIn(email.value,password.value);if(!r.ok){loginError.textContent=r.message||"Sign in failed";return}login.style.display="none";app.style.display="block";loadStudents()}
async function logout(){await APLUS_DATABASE.signOut();location.reload()}
async function loadStudents(){const r=await APLUS_DATABASE.list({search:search.value,status:status.value});if(!r.ok){alert(r.message||"Unable to load database");return}rows=r.data;count.textContent=rows.length;newCount.textContent=rows.filter(x=>x.application_status==="New").length;reviewCount.textContent=rows.filter(x=>x.application_status==="Reviewing").length;progressCount.textContent=rows.filter(x=>x.application_status==="In Progress").length;body.innerHTML=rows.map(x=>'<tr><td><b>'+esc(x.student_name||"Unnamed")+'</b><br><small>'+esc(x.student_id)+'</small></td><td>'+esc(x.current_level)+'</td><td>'+esc(x.target_university)+' · '+esc(x.target_course)+'</td><td>'+esc(x.entry_year)+'</td><td><select onchange="setStatus(\''+esc(x.student_id)+'\',this.value)"><option '+(x.application_status==="New"?"selected":"")+'>New</option><option '+(x.application_status==="Reviewing"?"selected":"")+'>Reviewing</option><option '+(x.application_status==="In Progress"?"selected":"")+'>In Progress</option><option '+(x.application_status==="Completed"?"selected":"")+'>Completed</option></select></td><td>'+esc(new Date(x.updated_at).toLocaleString())+'</td><td><button class="back" onclick="openStudent(\''+esc(x.student_id)+'\')">Open 360°</button></td></tr>').join("")}
async function setStatus(id,s){const r=await APLUS_DATABASE.updateStatus(id,s);if(!r.ok)alert(r.message||"Update failed")}
async function openStudent(id){const r=await APLUS_DATABASE.get(id);if(!r.ok){alert(r.message||"Unable to load student");return}app.style.display="none";detail.style.display="block";const x=r.data;detailBody.innerHTML='<h2>'+esc(x.student_name||"Unnamed Student")+'</h2><p class="muted">'+esc(x.student_id)+' · Created '+esc(new Date(x.created_at).toLocaleString())+'</p><div class="cards"><div class="card"><div class="muted">Target</div><b style="font-size:16px">'+esc(x.target_university)+' · '+esc(x.target_course)+'</b></div><div class="card"><div class="muted">Entry year</div><b>'+esc(x.entry_year)+'</b></div><div class="card"><div class="muted">Level</div><b style="font-size:16px">'+esc(x.current_level)+'</b></div><div class="card"><div class="muted">Status</div><b style="font-size:16px">'+esc(x.application_status)+'</b></div></div><div class="panel" style="margin-top:18px"><h3>Contact</h3><p>'+esc(x.student_name)+' · '+esc(x.parent_name)+' · '+esc(x.email)+' · '+esc(x.phone)+'</p></div><div class="panel"><h3>Academics & Activities</h3><p><b>Qualification:</b> '+esc(x.qualification)+'<br><b>Academic profile:</b> '+esc(x.academic_profile)+'<br><b>Subjects:</b> '+esc((x.subjects||[]).join(", "))+'</p><pre style="white-space:pre-wrap">'+esc(JSON.stringify(x.activities||[],null,2))+'</pre></div><div class="panel"><h3>Gap Analysis</h3><pre style="white-space:pre-wrap">'+esc(JSON.stringify(x.gap_analysis||{},null,2))+'</pre></div><div class="panel"><h3>Roadmap</h3><pre style="white-space:pre-wrap">'+esc(JSON.stringify(x.roadmap||[],null,2))+'</pre></div>'}
function showList(){detail.style.display="none";app.style.display="block"}loginBtn.onclick=login;search.onkeydown=e=>{if(e.key==="Enter")loadStudents()};
</script></body></html>
